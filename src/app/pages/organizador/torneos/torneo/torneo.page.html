<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button fill="clear" routerLink="/auth/torneos" aria-label="Volver a torneos">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Torneo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <app-informacion-torneo [torneo]="torneo" [validarOrganizador]="validarOrganizador"></app-informacion-torneo>
  <app-torneo [validarOrganizador]="validarOrganizador"></app-torneo>
</ion-content>
