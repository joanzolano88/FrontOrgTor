<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button text="" (click)="volverAtras()"></ion-back-button>
    </ion-buttons>
    <ion-title>Crear equipo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="team-shell">
    <div class="header-card">
      <span class="eyebrow">Nuevo equipo</span>
      <h2>{{ torneo.nombre || 'Registro de equipo' }}</h2>
      <p>Completa la información del equipo para registrarlo en el sistema.</p>
    </div>

    <form #f="ngForm" (ngSubmit)="onSubmit(f)" class="team-form">
      <div class="card-block">
        <div class="field-row">
          <ion-item lines="none" class="field-wrap">
            <ion-input label="Nombre del equipo" labelPlacement="floating" name="nombre" [(ngModel)]="equipo.nombre" required minlength="3" [counter]="true"></ion-input>
          </ion-item>
        </div>

        <div class="upload-block">
          <div class="upload-label">Escudo del equipo</div>
          <ion-input type="file" class="ion-hide" #fileEsc (change)="cargarImagen(imgEsc,'escudo',$event)" accept="image/png, image/jpeg" required></ion-input>
          <div class="upload-box" (click)="activarSubirArchivo(fileEsc)">
            <img appImageFallback="assets/images/shield-placeholder.svg" alt="Previsualización del escudo" #imgEsc id="img-escudo" [src]="imgEscudo()" />
            <span>Seleccionar imagen</span>
          </div>
        </div>

        <ion-item lines="none" class="field-wrap">
          <ion-select interface="popover" [value]="paisSeleccionado" (ionChange)="seleccionarPais($event.detail.value)" label="País" labelPlacement="floating" name="pais-equipo">
            <ion-select-option *ngFor="let pais of paises" [value]="pais.id">{{ pais.nombre }}</ion-select-option>
          </ion-select>
        </ion-item>

        <ion-item lines="none" class="field-wrap">
          <ion-select interface="popover" [value]="departamentoSeleccionado" (ionChange)="seleccionarDepartamento($event.detail.value)" label="Departamento" labelPlacement="floating" name="departamento-equipo">
            <ion-select-option *ngFor="let departamento of departamentos" [value]="departamento.id">{{ departamento.nombre }}</ion-select-option>
          </ion-select>
        </ion-item>

        <ion-item lines="none" class="field-wrap">
          <ion-select interface="popover" [value]="ciudadSeleccionada" (ionChange)="seleccionarCiudad($event.detail.value)" label="Ciudad" labelPlacement="floating" name="ciudad-equipo" required>
            <ion-select-option *ngFor="let ciudad of ciudades" [value]="ciudad.id">{{ ciudad.nombre }}</ion-select-option>
          </ion-select>
        </ion-item>

        <ion-item *ngIf="torneo.modalidadTorneo == 'GRUPOS'" lines="none" class="field-wrap">
          <ion-select label="Grupo del equipo" placeholder="" [(ngModel)]="equipo.grupo" name="grupo" required>
            <ion-select-option value="{{ i + 1 }}" *ngFor="let item of [].constructor(torneo.cantidadGrupos); let i = index">{{i + 1}}</ion-select-option>
          </ion-select>
        </ion-item>
      </div>

      <ion-button expand="block" type="submit" class="submit-btn">Guardar equipo</ion-button>
    </form>
  </div>

  <ion-alert
    [isOpen]="isAlertOpen"
    header="{{mensajeError}}"
    [buttons]="alertButtons"
    (didDismiss)="setOpen(false)"
  ></ion-alert>
</ion-content>
