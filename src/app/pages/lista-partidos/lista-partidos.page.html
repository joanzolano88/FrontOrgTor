<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button text="" defaultHref="/tabs/torneos"></ion-back-button>
    </ion-buttons>
    <ion-title>Lista Partidos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-item>
    <ion-searchbar show-clear-button="always" (ionInput)="buscador($event)" placeholder="Buscar Equipo"></ion-searchbar>
  </ion-item>
  <ion-item>
    <ion-select label="Selecionar estado" placeholder="estado" [(ngModel)]="estadoPartido" name="estadoPartido">
      <ion-select-option [value]="estado" *ngFor="let estado of estadosPartido">{{estado}}</ion-select-option>
    </ion-select>
  </ion-item>
  <ion-item>
    <ion-select label="Selecionar fase" placeholder="estado" [(ngModel)]="fasePartido" name="fasePartido">
      <ion-select-option [value]="fase" *ngFor="let fase of faseActual">{{fase}}</ion-select-option>
    </ion-select>
  </ion-item>
  <ion-grid>
    <ion-row>
      <ion-col>
        <ion-button (click)="listaPartidos()" expand="block">Buscar partidos</ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
  <ion-list  *ngFor="let listaPartidos of listaGruposPartidos; let i = index">
    <ion-accordion-group *ngIf="listaPartidos.length > 0 && validacionEstadoPartido(listaPartidos)">
      <ion-accordion value="first">
        <ion-item slot="header" color="primary">
          <ion-label *ngIf="torneo.faseTorneo == 'ELIMINATORIAS_GRUPOS' || torneo.faseTorneo == 'FASE_GRUPOS'">Grupo {{listaPartidos[0].grupo}}</ion-label>
          <ion-label *ngIf="torneo.faseTorneo != 'ELIMINATORIAS_GRUPOS' && torneo.faseTorneo != 'FASE_GRUPOS'">Llave</ion-label>
        </ion-item>
        <ng-container *ngFor="let partido of listaPartidos">
          <div class="ion-padding d-flex ion-justify-content-between" slot="content" 
              *ngIf="partido.estadoPartido == estadoPartido && compararBuscador(partido)" (click)="selecionarFecha(btnModalFecha, partido)">
            <label for="">{{partido.equipoLocal?.nombre}} vs {{partido.equipoVisitante?.nombre}}</label>
            <ion-badge slot="end" color="{{colorEstadoPartido(partido)}}">{{ partido.estadoPartido }}</ion-badge>
          </div>
        </ng-container>
      </ion-accordion>
    </ion-accordion-group>
  </ion-list>
  <ion-button id="open-modal" class="ion-hide" #btnModalFecha></ion-button>
  <ion-modal trigger="open-modal" (willDismiss)="onWillDismiss($event)">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-buttons slot="start">
            <ion-button (click)="cancel()">Cancelar</ion-button>
          </ion-buttons>
          <ion-title>{{textoPartido}}</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="confirm()" [strong]="true">Guardar</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <ion-item>
          <ion-datetime minuteValues="0,15,30,45" [(ngModel)]="partidoSeleccionado.fechaPartido" name="fecha"></ion-datetime>
        </ion-item>
        <ion-item>
          <ion-select label="Selecionar Cancha" placeholder="Cancha" [(ngModel)]="partidoSeleccionado.cancha!.id" name="canhca">
            <ion-select-option [value]="cancha.id" *ngFor="let cancha of listaCanchas">{{cancha.nombre}}</ion-select-option>
          </ion-select>
        </ion-item>
        <ion-button (click)="cancelarPartido()" expand="block" shape="round" *ngIf="estadoPartido == 'PROGRAMADO'">
          Cancelar partido
        </ion-button>
        <ion-button (click)="iniciarPartido()" expand="block" shape="round" *ngIf="estadoPartido == 'PROGRAMADO'">
          Jugar partido
        </ion-button>
      </ion-content>
    </ng-template>
  </ion-modal>
  <ion-alert
    [isOpen]="isAlertOpen"
    header="{{mensajeError}}"
    [buttons]="alertButtons"
    (didDismiss)="setOpen(false)"></ion-alert>
</ion-content>
